<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Seikkailuhuone</title>
<link rel="stylesheet" href="seikkailu.css">
</head>
<body>
<div id="stage">
  <svg viewBox="0 0 1024 600" width="1024" height="600">
    <!-- room -->
    <rect x="0" y="0" width="1024" height="600" fill="#342a4e"/>
    <rect x="0" y="0" width="1024" height="78" fill="#2b2140"/>
    <rect x="0" y="540" width="1024" height="60" fill="#5e3d1c"/>
    <rect x="0" y="534" width="1024" height="8" fill="#4a3018"/>
    <!-- title -->
    <text x="512" y="52" text-anchor="middle" font-family="Comic Sans MS, sans-serif"
          font-size="40" font-weight="800" fill="#ffd264">Seikkailuhuone</text>

    <!-- ===== row 1 ===== -->
    <g class="hot door" id="door-tulivuori">
      <rect x="58" y="150" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="66" y="158" width="164" height="134" rx="10" fill="#8a5a2b"/>
      <polygon points="148,196 186,262 110,262" fill="#7a6f86"/>
      <polygon points="148,196 164,224 132,224" fill="#e8452f"/>
      <rect x="140" y="262" width="16" height="10" fill="#ff8a4c"/>
      <circle cx="214" cy="226" r="6" fill="#ffd264"/>
      <text x="148" y="324" text-anchor="middle" class="doorlabel" fill="#fff7e6">Tulivuori</text>
    </g>
    <g class="hot door" id="door-muna">
      <rect x="298" y="150" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="306" y="158" width="164" height="134" rx="10" fill="#8a5a2b"/>
      <ellipse cx="388" cy="228" rx="40" ry="50" fill="#f3e7cc"/>
      <path d="M360 224 l16 8 l-12 10 l18 8 l-14 10" fill="none" stroke="#b07a3c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="454" cy="226" r="6" fill="#ffd264"/>
      <text x="388" y="324" text-anchor="middle" class="doorlabel" fill="#fff7e6">Muna</text>
    </g>
    <g class="hot door" id="door-luut">
      <rect x="538" y="150" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="546" y="158" width="164" height="134" rx="10" fill="#8a5a2b"/>
      <g fill="#f3e7cc" stroke="#b07a3c" stroke-width="3">
        <circle cx="604" cy="206" r="12"/><circle cx="604" cy="224" r="12"/>
        <circle cx="668" cy="236" r="12"/><circle cx="668" cy="254" r="12"/>
        <rect x="602" y="212" width="72" height="14" transform="rotate(20 638 219)"/>
      </g>
      <circle cx="694" cy="226" r="6" fill="#ffd264"/>
      <text x="628" y="324" text-anchor="middle" class="doorlabel" fill="#fff7e6">Luut</text>
    </g>
    <g class="hot door" id="door-tahdet">
      <rect x="778" y="150" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="786" y="158" width="164" height="134" rx="10" fill="#241a33"/>
      <polygon points="868,186 879,214 909,214 885,232 894,262 868,244 842,262 851,232 827,214 857,214" fill="#ffd264"/>
      <circle cx="812" cy="192" r="4" fill="#cfe8ff"/><circle cx="922" cy="250" r="4" fill="#cfe8ff"/>
      <circle cx="934" cy="226" r="6" fill="#ffd264"/>
      <text x="868" y="324" text-anchor="middle" class="doorlabel" fill="#fff7e6">T&#228;hdet</text>
    </g>

    <!-- ===== row 2 ===== -->
    <g class="hot door" id="door-taikapata">
      <rect x="58" y="350" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="66" y="358" width="164" height="134" rx="10" fill="#8a5a2b"/>
      <path d="M116 432 q32 44 64 0 Z" fill="#4a4150"/>
      <rect x="110" y="424" width="76" height="12" rx="6" fill="#7a6f86"/>
      <circle cx="140" cy="410" r="6" fill="#46c4a8"/><circle cx="160" cy="400" r="5" fill="#7cc0ff"/>
      <circle cx="214" cy="426" r="6" fill="#ffd264"/>
      <text x="148" y="524" text-anchor="middle" class="doorlabel" fill="#fff7e6">Taikapata</text>
    </g>
    <g class="hot door" id="door-salahuone">
      <rect x="298" y="350" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="306" y="358" width="164" height="134" rx="10" fill="#8a5a2b"/>
      <rect x="360" y="388" width="56" height="78" rx="10" fill="#5e3d1c"/>
      <circle cx="388" cy="414" r="10" fill="#ffd264"/>
      <rect x="384" y="420" width="8" height="22" fill="#ffd264"/>
      <circle cx="454" cy="426" r="6" fill="#ffd264"/>
      <text x="388" y="524" text-anchor="middle" class="doorlabel" fill="#fff7e6">Salahuone</text>
    </g>
    <g class="hot door" id="door-raketti">
      <rect x="538" y="350" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="546" y="358" width="164" height="134" rx="10" fill="#241a33"/>
      <path d="M628 384 q22 14 22 50 l-44 0 q0 -36 22 -50 Z" fill="#f3e7cc" stroke="#b7adcf" stroke-width="2"/>
      <circle cx="628" cy="416" r="8" fill="#7cc0ff"/>
      <polygon points="606,434 594,456 606,452" fill="#e8452f"/><polygon points="650,434 662,456 650,452" fill="#e8452f"/>
      <polygon points="618,460 638,460 628,478" fill="#ff8a4c"/>
      <circle cx="694" cy="426" r="6" fill="#ffd264"/>
      <text x="628" y="524" text-anchor="middle" class="doorlabel" fill="#fff7e6">Raketti</text>
    </g>
    <g class="hot door" id="door-hirviopaja">
      <rect x="778" y="350" width="180" height="150" rx="14" fill="#5e3d1c"/>
      <rect x="786" y="358" width="164" height="134" rx="10" fill="#8a5a2b"/>
      <path d="M836 396 q32 -26 64 0 l0 46 q-32 20 -64 0 Z" fill="#3aa64a"/>
      <polygon points="840,396 832,376 852,390" fill="#2b7d39"/><polygon points="896,396 904,376 884,390" fill="#2b7d39"/>
      <circle cx="854" cy="418" r="9" fill="#fff7e6"/><circle cx="884" cy="418" r="9" fill="#fff7e6"/>
      <circle cx="854" cy="420" r="4" fill="#2a2440"/><circle cx="884" cy="420" r="4" fill="#2a2440"/>
      <circle cx="934" cy="426" r="6" fill="#ffd264"/>
      <text x="868" y="524" text-anchor="middle" class="doorlabel" fill="#fff7e6">Hirvi&#246;t</text>
    </g>
  </svg>
</div>

<!-- load order: logic (data) -> engine (runtime) -->
<script src="content/logic.js"></script>
<script src="engine/core.js"></script>
<script src="engine/anim.js"></script>
<script src="engine/audio.js"></script>
<script src="engine/celebrate.js"></script>
<script>
(function () {
  "use strict";
  var C = Seik.core;

  /* which games are actually built; others navigate to a "tulossa" stub and look dimmed */
  var READY = { hirviopaja: 1, tulivuori: 1, muna: 1, taikapata: 1, luut: 1, tahdet: 1, raketti: 1, salahuone: 1 };  /* all 8 live */

  var DOORS = [
    "tulivuori", "muna", "luut", "tahdet",
    "taikapata", "salahuone", "raketti", "hirviopaja"
  ];

  C.ready(function () {
    C.initStage();
    Seik.audio.setBase("assets/audio/");
    Seik.audio.setSounds(["click", "success"]);   /* hub only needs these */
    C.addMuteButton();

    for (var i = 0; i < DOORS.length; i++) {
      (function (slug) {
        var g = C.$("door-" + slug);
        if (!g) return;
        if (!READY[slug]) {
          g.setAttribute("opacity", "0.72");
          /* small "tulossa" (coming soon) tag at the door's top-centre */
          var t = C.svg("text", {
            "text-anchor": "middle", "font-family": "Comic Sans MS, sans-serif",
            "font-size": "18", "font-weight": "800", fill: "#ff8a4c"
          });
          var r = g.getElementsByTagName("rect")[0];
          var cx = parseInt(r.getAttribute("x"), 10) + parseInt(r.getAttribute("width"), 10) / 2;
          var cy = parseInt(r.getAttribute("y"), 10) - 6;
          t.setAttribute("x", cx); t.setAttribute("y", cy);
          t.appendChild(document.createTextNode("tulossa"));
          g.appendChild(t);
        }
        C.tap(g, function () {
          Seik.audio.play("click");
          C.go("games/" + slug + ".html");
        });
      })(DOORS[i]);
    }
  });
})();
</script>
</body>
</html>
