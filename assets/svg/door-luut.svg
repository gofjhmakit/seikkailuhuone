  <polygon points="94,170 98,182 104,168" fill="#f3e7cc" stroke="#b07a3c" stroke-width="2"/>
  <polygon points="116,170 120,182 126,168" fill="#f3e7cc" stroke="#b07a3c" stroke-width="2"/>
  <!-- little sand sparkle -->
  <path d="M190 66 l4 11 l11 1 l-9 7 l3 11 l-9 -6 l-9 6 l3 -11 l-9 -7 l11 -1 Z" fill="#ffd264"/>
