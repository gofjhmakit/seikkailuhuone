    <rect x="132" y="146" width="74" height="14" rx="7" fill="#f3e7cc" stroke="#b07a3c" stroke-width="4"/>
    <circle cx="132" cy="146" r="9" fill="#f3e7cc" stroke="#b07a3c" stroke-width="4"/>
    <circle cx="132" cy="160" r="9" fill="#f3e7cc" stroke="#b07a3c" stroke-width="4"/>
    <circle cx="206" cy="146" r="9" fill="#f3e7cc" stroke="#b07a3c" stroke-width="4"/>
    <circle cx="206" cy="160" r="9" fill="#f3e7cc" stroke="#b07a3c" stroke-width="4"/>
  </g>
  <!-- dino skull peeking from the sand -->
  <path d="M156 166 Q174 150 168 128 Q160 106 126 106 Q90 108 60 128 Q42 140 52 154 Q62 168 94 170 Q128 174 156 166 Z" fill="#f3e7cc" stroke="#b07a3c" stroke-width="5"/>
