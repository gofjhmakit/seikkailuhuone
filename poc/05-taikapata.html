<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Taikapata</title>
<style>
  html,body{margin:0;height:100%;background:#0d0a14;overflow:hidden;
    font-family:"Comic Sans MS",system-ui,sans-serif;}
  #stage{position:absolute;left:50%;top:50%;width:1024px;height:600px;
    transform:translate(-50%,-50%);transform-origin:center center;
    background:linear-gradient(#241733,#120a1c);border-radius:18px;overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,0.6);}
  .title{position:absolute;top:16px;left:0;right:0;text-align:center;color:#eebefa;
    font-size:36px;font-weight:800;}
  .hint{position:absolute;top:62px;left:0;right:0;text-align:center;color:#d0bfff;font-size:24px;}
  .bottle{position:absolute;bottom:40px;width:120px;height:170px;cursor:pointer;
    transition:transform .12s;text-align:center;}
  .bottle:active{transform:translateY(5px);}
  .bname{color:#fff;font-size:20px;margin-top:4px;}
  #pot{position:absolute;left:50%;top:150px;margin-left:-150px;width:300px;height:260px;}
  #mix{position:absolute;right:50px;top:200px;width:150px;height:150px;border:none;border-radius:50%;
    background:#f59f00;color:#3a2a00;font-size:30px;font-weight:800;cursor:pointer;box-shadow:0 8px 0 #c77f00;}
  #mix:active{transform:translateY(5px);box-shadow:0 3px 0 #c77f00;}
  #clear{position:absolute;left:50px;top:230px;width:130px;height:90px;border:none;border-radius:16px;
    background:#495057;color:#fff;font-size:24px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 #343a40;}
  .bub{position:absolute;border-radius:50%;background:rgba(255,255,255,0.6);pointer-events:none;}
  #result{position:absolute;left:50%;top:100px;margin-left:-45px;font-size:90px;opacity:0;
    transition:opacity .3s,transform .3s;pointer-events:none;}
  #fx{position:absolute;left:0;top:0;pointer-events:none;}
</style>
</head>
<body>
<div id="stage">
  <div class="title">taikapata</div>
  <div class="hint" id="hint">pudota 2 ainesta pataan ja sekoita</div>
  <canvas id="fx" width="1024" height="600"></canvas>

  <svg id="pot" viewBox="0 0 300 260">
    <ellipse cx="150" cy="70" rx="120" ry="34" fill="#2b2140"/>
    <path d="M30 70 Q30 230 150 240 Q270 230 270 70 Z" fill="#3a2a52"/>
    <path d="M30 70 Q30 230 150 240 Q270 230 270 70 Z" fill="#241733" opacity="0.4"/>
    <clipPath id="pc"><path d="M38 78 Q40 220 150 230 Q260 220 262 78 Z"/></clipPath>
    <g clip-path="url(#pc)">
      <rect id="liquid" x="38" y="150" width="224" height="120" fill="#4a3b6b"/>
    </g>
    <ellipse id="surface" cx="150" cy="150" rx="112" ry="20" fill="#6b5a9c"/>
    <rect x="20" y="60" width="260" height="20" rx="10" fill="#4a3b6b"/>
  </svg>

  <div id="result">&#129504;</div>
  <button id="mix">sekoita</button>
  <button id="clear">tyhjennä</button>
</div>

<script>
"use strict";
(function(){
  var AC=window.AudioContext||window.webkitAudioContext, ac=AC?new AC():null;
  function tone(f0,f1,dur,type,vol){
    if(!ac) return; if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
  }
  function noise(dur,vol,hz){
    if(!ac) return; if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
    var n=Math.floor(ac.sampleRate*dur),b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
    for(var i=0;i<n;i++){ d[i]=(Math.random()*2-1)*(1-i/n); }
    var s=ac.createBufferSource(),g=ac.createGain(),lp=ac.createBiquadFilter();
    lp.type="lowpass"; lp.frequency.value=hz||800; s.buffer=b; g.gain.value=vol||0.3;
    s.connect(lp);lp.connect(g);g.connect(ac.destination);s.start();
  }
  function glug(){ tone(220,120,0.18,"sine",0.14); }
  function boom(){ noise(0.5,0.4,500); tone(90,40,0.5,"sawtooth",0.2); }
  function ribbit(){ tone(180,300,0.1,"square",0.14); setTimeout(function(){tone(150,250,0.12,"square",0.12);},110); }

  var stage=document.getElementById("stage");
  function fit(){ var s=Math.min(window.innerWidth/1024,window.innerHeight/600);
    stage.style.transform="translate(-50%,-50%) scale("+s+")"; }
  window.addEventListener("resize",fit); fit();

  var ING=[
    {n:"tuli",   c:"#ff6b00"},
    {n:"vesi",   c:"#1c7ed6"},
    {n:"myrkky", c:"#37b24d"},
    {n:"tähti",  c:"#f59f00"}
  ];
  var xs=[40,190,660,810];
  var liquid=document.getElementById("liquid"), surface=document.getElementById("surface");
  var hint=document.getElementById("hint"), resEl=document.getElementById("result");
  var fx=document.getElementById("fx"), fctx=fx.getContext("2d");
  var inPot=[], baseColor="#4a3b6b";

  for(var i=0;i<ING.length;i++){ (function(ing,x){
    var b=document.createElement("div"); b.className="bottle"; b.style.left=x+"px";
    b.innerHTML='<svg width="120" height="140" viewBox="0 0 120 140">'+
      '<rect x="48" y="4" width="24" height="26" rx="4" fill="#cdd"/>'+
      '<path d="M40 30 L80 30 L92 60 L92 126 Q92 136 82 136 L38 136 Q28 136 28 126 L28 60 Z" fill="rgba(255,255,255,0.18)" stroke="#ccd" stroke-width="2"/>'+
      '<path d="M32 78 L88 78 L88 126 Q88 132 82 132 L38 132 Q32 132 32 126 Z" fill="'+ing.c+'"/>'+
      '</svg><div class="bname">'+ing.n+'</div>';
    b.onclick=function(){ addIng(ing); };
    stage.appendChild(b);
  })(ING[i], xs[i]); }

  function mixColors(list){
    var r=0,g=0,bl=0;
    for(var i=0;i<list.length;i++){
      var h=list[i].c; r+=parseInt(h.substr(1,2),16); g+=parseInt(h.substr(3,2),16); bl+=parseInt(h.substr(5,2),16);
    }
    r=Math.round(r/list.length); g=Math.round(g/list.length); bl=Math.round(bl/list.length);
    return "rgb("+r+","+g+","+bl+")";
  }

  function addIng(ing){
    if(inPot.length>=2){ hint.textContent="pata on täynnä — sekoita!"; return; }
    inPot.push(ing); glug();
    var col=mixColors(inPot);
    liquid.setAttribute("fill",col); surface.setAttribute("fill",col);
    liquid.setAttribute("y", 150-inPot.length*18); liquid.setAttribute("height", 120+inPot.length*18);
    surface.setAttribute("cy", 150-inPot.length*18);
    if(inPot.length<2){ hint.textContent="lisää vielä yksi aines"; }
    else { hint.textContent="paina sekoita!"; }
  }

  function bubbles(n){
    for(var i=0;i<n;i++){ (function(d){
      setTimeout(function(){
        var bb=document.createElement("div"); bb.className="bub";
        var sz=10+Math.random()*22;
        bb.style.width=sz+"px"; bb.style.height=sz+"px";
        bb.style.left=(430+Math.random()*160)+"px"; bb.style.top="300px";
        stage.appendChild(bb);
        bb.style.transition="top 1s ease-out, opacity 1s";
        setTimeout(function(){ bb.style.top="150px"; bb.style.opacity="0"; },20);
        setTimeout(function(){ if(bb.parentNode) bb.parentNode.removeChild(bb); },1100);
      }, d*90);
    })(i); }
  }

  function burst(color){
    var parts=[], t0=Date.now();
    for(var i=0;i<24;i++){ var a=Math.random()*Math.PI*2, sp=3+Math.random()*7;
      parts.push({x:512,y:200,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:4+Math.random()*7}); }
    (function anim(){
      var age=(Date.now()-t0)/900; fctx.clearRect(0,0,1024,600);
      if(age>=1){ fctx.clearRect(0,0,1024,600); return; }
      for(var i=0;i<parts.length;i++){ var p=parts[i]; p.vy+=0.2; p.x+=p.vx; p.y+=p.vy;
        fctx.globalAlpha=1-age; fctx.fillStyle=color; fctx.beginPath();
        fctx.arc(p.x,p.y,p.r,0,Math.PI*2); fctx.fill(); }
      fctx.globalAlpha=1; (window.requestAnimationFrame||setTimeout)(anim,16);
    })();
  }

  function showResult(sym){ resEl.innerHTML=sym; resEl.style.opacity="1"; resEl.style.transform="translateY(-10px) scale(1.1)";
    setTimeout(function(){ resEl.style.opacity="0"; resEl.style.transform="none"; },1800); }

  document.getElementById("mix").onclick=function(){
    if(inPot.length<2){ hint.textContent="laita ensin 2 ainesta"; return; }
    bubbles(8); noise(0.4,0.12,1200);
    // outcome keyed by which ingredients (combinatorial, a little random)
    var names=[inPot[0].n, inPot[1].n].sort().join("+");
    setTimeout(function(){
      var out;
      if(names.indexOf("tuli")>=0 && names.indexOf("myrkky")>=0){ out={m:"PAM! pieni pamaus",s:"💥",f:boom,c:"#ff6b00"}; }
      else if(names.indexOf("tuli")>=0 && names.indexOf("vesi")>=0){ out={m:"sihisee! höyryä",s:"💨",f:function(){noise(0.6,0.18,2500);},c:"#cdd"}; }
      else if(names.indexOf("myrkky")>=0 && names.indexOf("vesi")>=0){ out={m:"kvak! sammakko!",s:"🐸",f:ribbit,c:"#37b24d"}; }
      else if(names.indexOf("tähti")>=0){ out={m:"taikaa! kimalletta",s:"✨",f:function(){tone(900,1500,0.3,"sine",0.12);},c:"#ffe066"}; }
      else { out={m:"pulp pulp... kuplia",s:"🫗",f:function(){tone(300,500,0.3,"sine",0.1);},c:"#845ef7"}; }
      hint.textContent=out.m; showResult(out.s); burst(out.c); out.f();
    }, 700);
  };

  document.getElementById("clear").onclick=function(){
    inPot=[]; liquid.setAttribute("fill",baseColor); surface.setAttribute("fill","#6b5a9c");
    liquid.setAttribute("y","150"); liquid.setAttribute("height","120"); surface.setAttribute("cy","150");
    hint.textContent="pudota 2 ainesta pataan ja sekoita"; tone(400,300,0.15,"sine",0.1);
  };
})();
</script>
</body>
</html>
