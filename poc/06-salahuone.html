<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Salahuone</title>
<style>
  html,body{margin:0;height:100%;background:#0c0b10;overflow:hidden;
    font-family:"Comic Sans MS",system-ui,sans-serif;}
  #stage{position:absolute;left:50%;top:50%;width:1024px;height:600px;
    transform:translate(-50%,-50%);transform-origin:center center;
    border-radius:18px;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,0.6);}
  .title{position:absolute;top:14px;left:0;right:0;text-align:center;color:#fff;
    font-size:30px;font-weight:800;z-index:6;text-shadow:0 2px 4px #000;}
  .hint{position:absolute;top:54px;left:0;right:0;text-align:center;color:#ffe066;font-size:22px;z-index:6;text-shadow:0 2px 3px #000;}
  svg{display:block;}
  .hot{cursor:pointer;}
  .hot:active{opacity:0.85;}
  #dim{transition:opacity .5s;}
</style>
</head>
<body>
<div id="stage">
  <div class="title">salahuone</div>
  <div class="hint" id="hint">etsi piilotettu avain — kokeile kaikkea!</div>
  <svg width="1024" height="600" viewBox="0 0 1024 600">
    <!-- room -->
    <rect x="0" y="0" width="1024" height="420" fill="#7a5c86"/>
    <rect x="0" y="420" width="1024" height="180" fill="#5a3f22"/>
    <rect x="0" y="406" width="1024" height="16" fill="#4a3219"/>

    <!-- window with night sky -->
    <g>
      <rect x="60" y="80" width="200" height="180" rx="8" fill="#14163a"/>
      <circle cx="120" cy="130" r="26" fill="#ffe8a3"/>
      <g class="hot" id="winstar">
        <path d="M210 150 l7 20 l20 0 l-16 13 l6 20 l-17 -12 l-17 12 l6 -20 l-16 -13 l20 0 Z" fill="#ffe066"/>
      </g>
      <rect x="54" y="74" width="212" height="192" rx="10" fill="none" stroke="#4a3219" stroke-width="12"/>
      <rect x="156" y="80" width="8" height="180" fill="#4a3219"/>
      <rect x="60" y="166" width="200" height="8" fill="#4a3219"/>
    </g>

    <!-- cuckoo clock -->
    <g class="hot" id="clock">
      <rect x="470" y="70" width="120" height="150" rx="10" fill="#8a5a2b"/>
      <polygon points="470,70 530,36 590,70" fill="#6b4420"/>
      <circle cx="530" cy="150" r="40" fill="#f1e6cf"/>
      <line x1="530" y1="150" x2="530" y2="124" stroke="#333" stroke-width="4"/>
      <line x1="530" y1="150" x2="548" y2="150" stroke="#333" stroke-width="4"/>
      <rect id="cuckooDoor" x="508" y="76" width="44" height="34" fill="#6b4420"/>
      <g id="cuckooBird" opacity="0"><ellipse cx="530" cy="96" rx="16" ry="12" fill="#ffd43b"/>
        <circle cx="522" cy="92" r="3" fill="#222"/><polygon points="514,96 502,100 514,104" fill="#ff922b"/></g>
    </g>

    <!-- picture (hides the key) -->
    <g class="hot" id="picture">
      <g id="pframe">
        <rect x="740" y="90" width="150" height="120" rx="6" fill="#caa06a" stroke="#6b4420" stroke-width="8"/>
        <rect x="756" y="106" width="118" height="88" fill="#a5d8ff"/>
        <polygon points="756,194 800,140 830,170 860,120 874,150 874,194" fill="#2f9e44"/>
        <circle cx="850" cy="124" r="12" fill="#ffd43b"/>
      </g>
      <g id="key" opacity="0">
        <circle cx="800" cy="150" r="16" fill="none" stroke="#ffd43b" stroke-width="7"/>
        <rect x="812" y="146" width="48" height="8" fill="#ffd43b"/>
        <rect x="846" y="154" width="8" height="14" fill="#ffd43b"/>
        <rect x="832" y="154" width="8" height="14" fill="#ffd43b"/>
      </g>
    </g>

    <!-- lamp -->
    <g class="hot" id="lamp">
      <rect x="330" y="80" width="10" height="90" fill="#555"/>
      <path d="M300 170 L370 170 L358 210 L312 210 Z" fill="#f59f00"/>
      <circle id="bulb" cx="335" cy="210" r="10" fill="#ffe066" opacity="0.3"/>
    </g>

    <!-- chest -->
    <g class="hot" id="chest">
      <rect x="120" y="440" width="190" height="110" rx="8" fill="#8a5a2b"/>
      <rect id="chestLid" x="116" y="410" width="198" height="46" rx="10" fill="#6b4420"/>
      <rect x="205" y="452" width="20" height="26" fill="#ffd43b"/>
    </g>

    <!-- cat -->
    <g class="hot" id="cat">
      <ellipse cx="760" cy="520" rx="70" ry="40" fill="#495057"/>
      <circle cx="810" cy="480" r="34" fill="#495057"/>
      <polygon points="788,456 796,430 810,452" fill="#495057"/>
      <polygon points="832,456 824,430 810,452" fill="#495057"/>
      <circle cx="802" cy="478" r="5" fill="#ffe066"/><circle cx="820" cy="478" r="5" fill="#ffe066"/>
      <path d="M700 520 q-30 -6 -36 -34" stroke="#495057" stroke-width="12" fill="none" stroke-linecap="round"/>
    </g>

    <!-- dim overlay (lamp off) -->
    <rect id="dim" x="0" y="0" width="1024" height="600" fill="#0a0a1e" opacity="0.5" pointer-events="none"/>
  </svg>
</div>

<script>
"use strict";
(function(){
  var AC=window.AudioContext||window.webkitAudioContext, ac=AC?new AC():null;
  function tone(f0,f1,dur,type,vol){
    if(!ac) return; if(ac.state==="suspended"){try{ac.resume();}catch(e){}}
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type||"sine"; o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(vol||0.2,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
  }
  function meow(){ tone(500,760,0.18,"sawtooth",0.14); tone(760,420,0.22,"sawtooth",0.12); }
  function cuckoo(){ tone(780,780,0.16,"sine",0.14); setTimeout(function(){tone(620,620,0.2,"sine",0.14);},200); }
  function creak(){ tone(140,90,0.4,"sawtooth",0.1); }
  function chime(){ tone(880,1320,0.2,"sine",0.14); tone(1320,1760,0.22,"sine",0.1); }

  var stage=document.getElementById("stage");
  function fit(){ var s=Math.min(window.innerWidth/1024,window.innerHeight/600);
    stage.style.transform="translate(-50%,-50%) scale("+s+")"; }
  window.addEventListener("resize",fit); fit();

  var hint=document.getElementById("hint");
  function $(id){ return document.getElementById(id); }

  // lamp toggle
  var lampOn=false, dim=$("dim"), bulb=$("bulb");
  $("lamp").onclick=function(){
    lampOn=!lampOn; dim.setAttribute("opacity", lampOn?"0":"0.5");
    bulb.setAttribute("opacity", lampOn?"1":"0.3");
    tone(600,600,0.06,"square",0.08);
    hint.textContent=lampOn?"valo syttyi!":"pimeää...";
  };

  // cat jump + meow
  var cat=$("cat"), jumping=false;
  cat.onclick=function(){
    if(jumping) return; jumping=true; meow();
    cat.style.transition="transform .22s ease-out"; cat.style.transform="translateY(-40px)";
    setTimeout(function(){ cat.style.transform="translateY(0)"; },230);
    setTimeout(function(){ jumping=false; },480);
    hint.textContent="miau! kissa hyppäsi";
  };

  // cuckoo clock
  var door=$("cuckooDoor"), bird=$("cuckooBird");
  $("clock").onclick=function(){
    cuckoo();
    door.style.transition="transform .25s"; door.style.transform="translateX(-40px)";
    bird.setAttribute("opacity","1"); bird.style.transition="transform .25s"; bird.style.transform="translateY(-6px)";
    setTimeout(function(){ door.style.transform="translateX(0)"; bird.setAttribute("opacity","0"); bird.style.transform="none"; },1100);
    hint.textContent="kukkuu! kukkuu!";
  };

  // window star twinkle
  $("winstar").onclick=function(){ chime(); hint.textContent="tähti tuikkii"; };

  // chest open
  var lid=$("chestLid"), chestOpen=false;
  $("chest").onclick=function(){
    chestOpen=!chestOpen; creak();
    lid.style.transition="transform .3s";
    lid.style.transform=chestOpen?"translate(0,-34px) rotate(-14deg)":"none";
    lid.style.transformOrigin="116px 410px";
    hint.textContent=chestOpen?"arkku on tyhjä... ei avainta":"suljit arkun";
  };

  // picture -> reveal key (the goal)
  var frame=$("pframe"), key=$("key"), found=false;
  $("picture").onclick=function(){
    if(found){ return; }
    found=true; creak();
    frame.style.transition="transform .4s"; frame.style.transformOrigin="740px 90px";
    frame.style.transform="rotate(22deg) translate(10px,-6px)";
    setTimeout(function(){ key.setAttribute("opacity","1"); chime();
      hint.textContent="löysit avaimen! taulun takaa!"; },350);
  };
})();
</script>
</body>
</html>
