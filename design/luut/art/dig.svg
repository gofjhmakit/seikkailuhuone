<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600" stroke-linejoin="round" stroke-linecap="round">
  <defs>
    <!-- the ONE allowed gradient: dig-site sky -->
    <linearGradient id="digSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc0ff"/>
      <stop offset="1" stop-color="#a5d8ff"/>
    </linearGradient>
  </defs>

  <!-- ===================== SKY + HORIZON ===================== -->
  <rect x="0" y="0" width="1024" height="180" fill="url(#digSky)"/>
  <circle cx="864" cy="64" r="38" fill="#ffd264"/>
  <path d="M0 180 Q240 140 500 172 Q760 142 1024 174 L1024 180 Z" fill="#3aa64a"/>

  <!-- ===================== EARTH + DIG PIT ===================== -->
  <rect x="0" y="172" width="1024" height="428" fill="#8a5a2b"/>
  <rect x="0" y="172" width="1024" height="10" fill="#5e3d1c"/>
  <rect x="104" y="164" width="816" height="372" rx="20" fill="#4a3219"/>
  <rect x="116" y="176" width="792" height="348" rx="14" fill="#5e3d1c"/>

  <!-- ===================== DIG CONTENTS (engine injects skeleton + surprises HERE, under the grid) ===================== -->
  <g id="digContents"></g>

  <!-- ===================== SAND GRID — 28 tiles (7 cols x 4 rows), #t{r}_{c} ===================== -->
  <g id="sandGrid">
    <rect id="t0_0" x="120" y="180" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t0_1" x="232" y="180" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t0_2" x="344" y="180" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t0_3" x="456" y="180" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t0_4" x="568" y="180" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t0_5" x="680" y="180" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t0_6" x="792" y="180" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_0" x="120" y="265" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_1" x="232" y="265" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_2" x="344" y="265" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_3" x="456" y="265" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_4" x="568" y="265" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_5" x="680" y="265" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t1_6" x="792" y="265" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_0" x="120" y="350" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_1" x="232" y="350" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_2" x="344" y="350" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_3" x="456" y="350" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_4" x="568" y="350" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_5" x="680" y="350" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t2_6" x="792" y="350" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_0" x="120" y="435" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_1" x="232" y="435" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_2" x="344" y="435" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_3" x="456" y="435" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_4" x="568" y="435" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_5" x="680" y="435" width="112" height="85" fill="#ffd264" stroke="#b07a3c" stroke-width="2"/>
    <rect id="t3_6" x="792" y="435" width="112" height="85" fill="#ffb43d" stroke="#b07a3c" stroke-width="2"/>
  </g>

  <!-- ===================== COUNTER PLAQUE (engine writes "luut: n/N" here) ===================== -->
  <g id="counterPlaque">
    <rect x="402" y="20" width="220" height="44" rx="10" fill="#5e3d1c" stroke="#4a3219" stroke-width="4"/>
    <rect x="410" y="28" width="204" height="28" rx="6" fill="#f3e7cc"/>
  </g>

  <!-- ===================== BRUSH TOOL (#brush) — rests here; engine moves it to the tapped tile ===================== -->
  <g id="brush">
    <line x1="958" y1="150" x2="992" y2="112" stroke="#b07a3c" stroke-width="10"/>
    <rect x="940" y="146" width="34" height="20" rx="6" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="4" transform="rotate(-42 957 156)"/>
    <path d="M936 168 l10 -12 l16 14 l-8 12 Z" fill="#fff7e6" stroke="#8a5a2b" stroke-width="3"/>
    <line x1="934" y1="172" x2="940" y2="178" stroke="#fff7e6" stroke-width="2"/>
    <line x1="942" y1="178" x2="948" y2="184" stroke="#fff7e6" stroke-width="2"/>
  </g>

  <!-- ===================== NAV: HOME (#navHome) → hub ===================== -->
  <g id="navHome" class="hot">
    <rect x="16" y="18" width="62" height="56" rx="12" fill="#ffd264" stroke="#8a5a2b" stroke-width="4"/>
    <polygon points="28,48 47,30 66,48" fill="#5e3d1c"/>
    <rect x="37" y="48" width="20" height="18" fill="#5e3d1c"/>
    <rect x="43" y="54" width="8" height="12" fill="#ffd264"/>
  </g>

  <!-- ===================== NAV: LÖYTÖKIRJA (#navBook) → museum ===================== -->
  <g id="navBook" class="hot">
    <rect x="40" y="544" width="200" height="40" rx="10" fill="#f3e7cc" stroke="#b07a3c" stroke-width="4"/>
    <rect x="52" y="552" width="30" height="24" rx="2" fill="#e8452f" stroke="#5e3d1c" stroke-width="3"/>
    <line x1="67" y1="552" x2="67" y2="576" stroke="#5e3d1c" stroke-width="2"/>
    <text x="162" y="572" font-family="Comic Sans MS, sans-serif" font-size="18" font-weight="700" fill="#2a2440" text-anchor="middle">löytökirja</text>
  </g>

  <!-- ===================== NAV: KAIVA UUSI (#navNew) → new dig ===================== -->
  <g id="navNew" class="hot">
    <rect x="784" y="544" width="200" height="40" rx="10" fill="#ffd264" stroke="#8a5a2b" stroke-width="4"/>
    <path d="M806 574 L806 560 L800 560 L812 548 L824 560 L818 560 L818 574 Z" fill="#5e3d1c"/>
    <text x="902" y="572" font-family="Comic Sans MS, sans-serif" font-size="18" font-weight="700" fill="#2a2440" text-anchor="middle">kaiva uusi</text>
  </g>
</svg>
