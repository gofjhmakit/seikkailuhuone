<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" width="240" height="120" stroke-linejoin="round" stroke-linecap="round">
  <!-- ATLAS: 8 mini clue icons, one per 60x60 cell. The clue card (#spr_cluecard)
       drops the matching icon into its slot so a pre-reader can read the hint. -->
  <rect x="0" y="0" width="240" height="120" fill="#f3e7cc"/>
  <line x1="60" y1="0" x2="60" y2="120" stroke="#b07a3c" stroke-width="1" opacity="0.4"/>
  <line x1="120" y1="0" x2="120" y2="120" stroke="#b07a3c" stroke-width="1" opacity="0.4"/>
  <line x1="180" y1="0" x2="180" y2="120" stroke="#b07a3c" stroke-width="1" opacity="0.4"/>
  <line x1="0" y1="60" x2="240" y2="60" stroke="#b07a3c" stroke-width="1" opacity="0.4"/>

  <!-- #ic_picture : taulun takana -->
  <g id="ic_picture" transform="translate(8,12)">
    <rect x="0" y="0" width="44" height="36" rx="3" fill="#b07a3c" stroke="#5e3d1c" stroke-width="3"/>
    <rect x="5" y="5" width="34" height="26" fill="#a5d8ff"/>
    <polygon points="5,31 20,16 30,24 39,14 39,31" fill="#3aa64a"/>
  </g>

  <!-- #ic_rug : maton alla -->
  <g id="ic_rug" transform="translate(68,18)">
    <ellipse cx="22" cy="14" rx="22" ry="12" fill="#46c4a8" stroke="#2b7d39" stroke-width="3"/>
    <ellipse cx="22" cy="14" rx="12" ry="6" fill="none" stroke="#ffd264" stroke-width="2"/>
  </g>

  <!-- #ic_plant : kukkaruukussa -->
  <g id="ic_plant" transform="translate(132,10)">
    <path d="M4 20 L32 20 L28 44 L8 44 Z" fill="#b07a3c" stroke="#5e3d1c" stroke-width="3"/>
    <path d="M18 20 q-16 -8 -12 -22 q14 4 14 22 Z" fill="#2b7d39"/>
    <path d="M18 20 q16 -8 12 -22 q-14 4 -14 22 Z" fill="#3aa64a"/>
  </g>

  <!-- #ic_book : kirjan takana -->
  <g id="ic_book" transform="translate(192,12)">
    <rect x="0" y="0" width="34" height="40" rx="3" fill="#e8452f" stroke="#5e3d1c" stroke-width="3"/>
    <line x1="8" y1="0" x2="8" y2="40" stroke="#5e3d1c" stroke-width="2"/>
    <line x1="16" y1="12" x2="28" y2="12" stroke="#fff7e6" stroke-width="2"/>
  </g>

  <!-- #ic_musicbox : soittorasiassa -->
  <g id="ic_musicbox" transform="translate(8,76)">
    <rect x="0" y="14" width="44" height="26" rx="4" fill="#b07a3c" stroke="#5e3d1c" stroke-width="3"/>
    <rect x="-2" y="4" width="48" height="12" rx="3" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="3"/>
    <circle cx="10" cy="6" r="4" fill="#ffd264"/>
  </g>

  <!-- #ic_horse : keinuhevosen alla -->
  <g id="ic_horse" transform="translate(68,72)">
    <path d="M2 40 q22 8 44 0" fill="none" stroke="#b07a3c" stroke-width="4"/>
    <ellipse cx="22" cy="22" rx="20" ry="10" fill="#ffb43d" stroke="#5e3d1c" stroke-width="3"/>
    <path d="M38 20 q12 -2 12 -14 q4 10 -4 16 Z" fill="#ffb43d" stroke="#5e3d1c" stroke-width="3"/>
  </g>

  <!-- #ic_barrel : tynnyrissä -->
  <g id="ic_barrel" transform="translate(132,72)">
    <path d="M6 44 Q0 22 6 2 L38 2 Q44 22 38 44 Z" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="3"/>
    <path d="M2 14 Q22 18 42 14 M2 32 Q22 36 42 32" fill="none" stroke="#b07a3c" stroke-width="3"/>
  </g>

  <!-- #ic_jar : hillopurkissa -->
  <g id="ic_jar" transform="translate(196,72)">
    <rect x="2" y="12" width="30" height="34" rx="8" fill="#e8452f" stroke="#8a5a2b" stroke-width="3"/>
    <rect x="0" y="4" width="34" height="10" rx="3" fill="#ffb43d" stroke="#8a5a2b" stroke-width="2"/>
  </g>
</svg>
