  </g>

  <!-- ===================== FIREPLACE (#fireplace / #flames / #marsh) ===================== -->
  <g id="fireplace" class="hot">
    <rect x="386" y="258" width="196" height="196" fill="#7a6f86" stroke="#4a4150" stroke-width="5"/>
    <rect x="376" y="244" width="216" height="22" rx="4" fill="#7a6f86" stroke="#4a4150" stroke-width="5"/>
    <rect x="416" y="300" width="136" height="154" fill="#241a33"/>
    <rect x="438" y="420" width="92" height="20" rx="10" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="4"/>
    <rect x="450" y="404" width="68" height="18" rx="9" fill="#b07a3c" stroke="#5e3d1c" stroke-width="4"/>
    <g id="flames">
      <path d="M484 418 q-30 -40 -4 -82 q6 28 22 32 q-12 -32 6 -52 q24 36 10 70 q12 -8 10 -28 q20 32 -8 60 Z" fill="#ff8a4c"/>
      <path d="M484 416 q-18 -30 0 -58 q16 22 6 42 q12 -8 8 -24 q14 24 -6 46 Z" fill="#ffb43d"/>
      <path d="M482 412 q-10 -20 2 -36 q10 14 2 26 q8 -4 6 -14 q8 16 -4 30 Z" fill="#ffd264"/>
    </g>
    <g id="marsh" opacity="0">
      <line x1="568" y1="358" x2="472" y2="392" stroke="#b07a3c" stroke-width="4"/>
      <circle cx="472" cy="392" r="12" fill="#fff7e6" stroke="#b07a3c" stroke-width="3"/>
    </g>
  </g>

  <!-- ===================== CUCKOO CLOCK (#clock / #clockDoor / #clockBird) ===================== -->
  <g id="clock" class="hot">
    <polygon points="636,86 690,52 744,86" fill="#5e3d1c"/>
    <rect x="640" y="84" width="100" height="134" rx="10" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="5"/>
    <circle cx="690" cy="156" r="34" fill="#f3e7cc" stroke="#5e3d1c" stroke-width="4"/>
    <line x1="690" y1="156" x2="690" y2="134" stroke="#2a2440" stroke-width="4"/>
    <line x1="690" y1="156" x2="706" y2="162" stroke="#2a2440" stroke-width="4"/>
    <rect id="clockDoor" x="668" y="92" width="44" height="34" rx="4" fill="#5e3d1c" stroke="#4a3219" stroke-width="2"/>
    <g id="clockBird" opacity="0">
      <ellipse cx="690" cy="108" rx="15" ry="11" fill="#ffd264"/>
      <circle cx="683" cy="104" r="3" fill="#2a2440"/>
      <polygon points="676,108 664,111 676,114" fill="#ff8a4c"/>
    </g>
  </g>

  <!-- ===================== PICTURE (#picture / #pictureFrame) ===================== -->
  <g id="picture" class="hot">
    <circle cx="786" cy="100" r="4" fill="#4a4150"/>
    <g id="pictureFrame">
      <rect x="780" y="96" width="150" height="120" rx="6" fill="#b07a3c" stroke="#5e3d1c" stroke-width="8"/>
      <rect x="794" y="110" width="122" height="92" fill="#a5d8ff"/>
