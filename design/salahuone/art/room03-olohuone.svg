    <rect x="40" y="60" width="190" height="182" rx="8" fill="none" stroke="#5e3d1c" stroke-width="12"/>
    <rect x="131" y="66" width="8" height="170" fill="#5e3d1c"/>
    <rect x="46" y="147" width="184" height="8" fill="#5e3d1c"/>
  </g>

  <!-- ===================== STANDING LAMP (#lamp / #lampGlow) ===================== -->
  <g id="lamp" class="hot">
    <circle id="lampGlow" cx="300" cy="300" r="74" fill="#ffd264" opacity="0"/>
    <rect x="295" y="300" width="10" height="150" fill="#4a4150"/>
    <ellipse cx="300" cy="452" rx="34" ry="10" fill="#4a4150"/>
    <path d="M266 300 L334 300 L320 250 L280 250 Z" fill="#ffb43d" stroke="#5e3d1c" stroke-width="5"/>
