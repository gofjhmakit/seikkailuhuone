      <circle cx="896" cy="140" r="12" fill="#ffd264"/>
    </g>
  </g>

  <!-- ===================== BOOKSHELF (#shelf / #book1) ===================== -->
  <g id="shelf" class="hot">
    <rect x="892" y="150" width="112" height="250" rx="6" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="5"/>
    <line x1="898" y1="246" x2="998" y2="246" stroke="#5e3d1c" stroke-width="5"/>
    <line x1="898" y1="332" x2="998" y2="332" stroke="#5e3d1c" stroke-width="5"/>
    <rect id="book1" x="906" y="186" width="18" height="58" rx="2" fill="#46c4a8" stroke="#2b7d39" stroke-width="3"/>
    <rect x="928" y="192" width="16" height="52" rx="2" fill="#e8452f" stroke="#5e3d1c" stroke-width="3"/>
    <rect x="948" y="184" width="18" height="60" rx="2" fill="#7cc0ff" stroke="#3a4a7a" stroke-width="3"/>
    <rect x="908" y="276" width="16" height="54" rx="2" fill="#ffb43d" stroke="#8a5a2b" stroke-width="3"/>
    <rect x="928" y="272" width="18" height="58" rx="2" fill="#3aa64a" stroke="#2b7d39" stroke-width="3"/>
    <rect x="952" y="280" width="16" height="50" rx="2" fill="#ff8a4c" stroke="#e8452f" stroke-width="3"/>
  </g>

  <!-- ===================== PLANT (#plant / #plantLeaves) ===================== -->
  <g id="plant" class="hot">
    <path d="M118 452 L188 452 L180 512 L126 512 Z" fill="#b07a3c" stroke="#5e3d1c" stroke-width="5"/>
    <rect x="112" y="444" width="82" height="14" rx="4" fill="#8a5a2b" stroke="#5e3d1c" stroke-width="4"/>
    <g id="plantLeaves">
      <path d="M153 448 q-40 -20 -30 -66 q34 10 36 64 Z" fill="#2b7d39"/>
      <path d="M153 448 q40 -20 30 -66 q-34 10 -36 64 Z" fill="#3aa64a"/>
      <path d="M153 450 q-6 -54 0 -84 q8 30 2 84 Z" fill="#3aa64a"/>
    </g>
  </g>

  <!-- ===================== RUG (#rug / #rugCorner) ===================== -->
  <g id="rug" class="hot">
    <ellipse cx="560" cy="552" rx="180" ry="40" fill="#46c4a8" stroke="#2b7d39" stroke-width="5"/>
    <ellipse cx="560" cy="552" rx="118" ry="24" fill="none" stroke="#ffd264" stroke-width="5"/>
    <g id="rugCorner">
      <path d="M390 560 q26 -16 54 -8 q-22 20 -54 20 Z" fill="#2b7d39" stroke="#1f5a2a" stroke-width="3"/>
    </g>
  </g>

  <!-- ===================== CAT (#cat) ===================== -->
  <g id="cat" class="hot">
    <path d="M464 550 q-28 -4 -34 -34" fill="none" stroke="#4a4150" stroke-width="12"/>
    <ellipse cx="530" cy="536" rx="58" ry="34" fill="#4a4150"/>
    <circle cx="570" cy="500" r="28" fill="#4a4150"/>
    <polygon points="552,478 558,456 572,476" fill="#4a4150"/>
    <polygon points="588,478 582,456 568,476" fill="#4a4150"/>
    <circle cx="562" cy="498" r="4.5" fill="#ffd264"/>
    <circle cx="578" cy="498" r="4.5" fill="#ffd264"/>
    <path d="M566 507 l4 5 l4 -5" fill="none" stroke="#241a33" stroke-width="2.5"/>
  </g>

  <!-- ===================== NAV: HOME (#navHome) ===================== -->
  <g id="navHome" class="hot">
    <rect x="16" y="18" width="62" height="56" rx="12" fill="#ffd264" stroke="#8a5a2b" stroke-width="4"/>
    <polygon points="28,48 47,30 66,48" fill="#5e3d1c"/>
    <rect x="37" y="48" width="20" height="18" fill="#5e3d1c"/>
    <rect x="43" y="54" width="8" height="12" fill="#ffd264"/>
  </g>

  <!-- ===================== NAV: RIGHT → KASVIHUONE (#navRight) ===================== -->
  <g id="navRight" class="hot">
    <rect x="828" y="548" width="130" height="30" rx="8" fill="#f3e7cc" stroke="#b07a3c" stroke-width="3"/>
    <text x="890" y="570" font-family="Comic Sans MS, sans-serif" font-size="16" font-weight="700" fill="#2a2440" text-anchor="middle">kasvihuone</text>
    <circle cx="978" cy="540" r="24" fill="#ffd264" stroke="#8a5a2b" stroke-width="4"/>
    <polygon points="970,526 992,540 970,554" fill="#5e3d1c"/>
  </g>

  <!-- ===================== DIM OVERLAY (#dim) — lamp off ===================== -->
  <rect id="dim" x="0" y="0" width="1024" height="600" fill="#241a33" opacity="0.45" pointer-events="none"/>
</svg>
