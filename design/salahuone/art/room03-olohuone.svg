  <rect x="0" y="430" width="1024" height="14" fill="#5e3d1c"/>
  <line x1="0" y1="502" x2="1024" y2="502" stroke="#5e3d1c" stroke-width="3" opacity="0.5"/>
  <line x1="0" y1="556" x2="1024" y2="556" stroke="#5e3d1c" stroke-width="3" opacity="0.5"/>

  <!-- ===================== WINDOW (#win / #winstar) ===================== -->
  <g id="win" class="hot">
    <rect x="46" y="66" width="184" height="170" rx="6" fill="#241a33"/>
    <circle cx="92" cy="112" r="22" fill="#ffd264"/>
    <circle cx="150" cy="92" r="2.5" fill="#cfe8ff"/>
    <circle cx="200" cy="120" r="2.5" fill="#cfe8ff"/>
    <circle cx="80" cy="202" r="2.5" fill="#cfe8ff"/>
    <g id="winstar">
      <path d="M182 150 l6 15 l16 1 l-12 10 l4 16 l-14 -9 l-14 9 l4 -16 l-12 -10 l16 -1 Z" fill="#cfe8ff" stroke="#7cc0ff" stroke-width="3"/>
