<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480" stroke-linejoin="round" stroke-linecap="round">
  <!-- ATLAS of overlay sprites. Each sprite is a <g id> with a local origin at its
       translate offset. Engine: take the inner markup, drop/adjust the translate,
       place where needed. Background + labels are preview-only (engine ignores). -->
  <rect x="0" y="0" width="480" height="480" fill="#241a33"/>
  <line x1="160" y1="0" x2="160" y2="480" stroke="#342a4e" stroke-width="2"/>
  <line x1="320" y1="0" x2="320" y2="480" stroke="#342a4e" stroke-width="2"/>
  <line x1="0" y1="160" x2="480" y2="160" stroke="#342a4e" stroke-width="2"/>
  <line x1="0" y1="320" x2="480" y2="320" stroke="#342a4e" stroke-width="2"/>

  <!-- #spr_key : golden key (local box ~90x44) -->
  <g id="spr_key" transform="translate(32,56)">
    <circle cx="20" cy="20" r="17" fill="#ffd264" stroke="#8a5a2b" stroke-width="4"/>
    <circle cx="20" cy="20" r="6" fill="#241a33"/>
    <rect x="33" y="15" width="54" height="10" rx="3" fill="#ffd264" stroke="#8a5a2b" stroke-width="3"/>
    <rect x="72" y="25" width="9" height="15" rx="1" fill="#ffd264" stroke="#8a5a2b" stroke-width="3"/>
    <rect x="58" y="25" width="9" height="12" rx="1" fill="#ffd264" stroke="#8a5a2b" stroke-width="3"/>
  </g>

  <!-- #spr_mouse : little mouse (local box ~76x52) -->
  <g id="spr_mouse" transform="translate(196,56)">
    <path d="M54 38 q18 -2 22 -16" fill="none" stroke="#7a6f86" stroke-width="5"/>
    <ellipse cx="34" cy="34" rx="26" ry="18" fill="#7a6f86" stroke="#4a4150" stroke-width="4"/>
    <circle cx="14" cy="26" r="13" fill="#7a6f86" stroke="#4a4150" stroke-width="4"/>
    <circle cx="22" cy="14" r="9" fill="#7a6f86" stroke="#4a4150" stroke-width="3"/>
    <circle cx="22" cy="14" r="4" fill="#ff8a4c"/>
    <circle cx="9" cy="26" r="3" fill="#2a2440"/>
    <circle cx="3" cy="30" r="3" fill="#ff8a4c"/>
  </g>

  <!-- #spr_cheese : cheese wedge, mice reward (local box ~64x40) -->
  <g id="spr_cheese" transform="translate(356,64)">
    <path d="M4 38 L60 10 L60 38 Z" fill="#ffd264" stroke="#b07a3c" stroke-width="4"/>
    <circle cx="30" cy="30" r="4" fill="#b07a3c"/>
    <circle cx="46" cy="24" r="3" fill="#b07a3c"/>
    <circle cx="19" cy="33" r="2.5" fill="#b07a3c"/>
  </g>

  <!-- #spr_star : glowing star-stone, the main collectible (local box ~60x60) -->
  <g id="spr_star" transform="translate(50,206)">
    <circle cx="30" cy="30" r="30" fill="#7cc0ff" opacity="0.2"/>
    <path d="M30 2 l9 18 l20 3 l-15 14 l4 20 l-18 -10 l-18 10 l4 -20 l-15 -14 l20 -3 Z" fill="#cfe8ff" stroke="#7cc0ff" stroke-width="3"/>
    <circle cx="30" cy="30" r="6" fill="#ffd264"/>
  </g>

  <!-- #spr_smokering : dragon smoke ring (local box ~40x40) -->
  <g id="spr_smokering" transform="translate(220,220)">
    <circle cx="20" cy="20" r="16" fill="none" stroke="#cfe8ff" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- #spr_cluecard : enlarged readable clue card (local box ~130x96).
       Engine draws the Finnish line over the two guide lines and drops a
       matching clue-icon into the slot. -->
  <g id="spr_cluecard" transform="translate(336,200)">
    <rect x="0" y="0" width="130" height="96" rx="8" fill="#f3e7cc" stroke="#b07a3c" stroke-width="5"/>
    <rect x="5" y="5" width="120" height="86" rx="6" fill="none" stroke="#b07a3c" stroke-width="2" opacity="0.5"/>
    <line x1="16" y1="26" x2="114" y2="26" stroke="#8a5a2b" stroke-width="5"/>
    <line x1="16" y1="44" x2="90" y2="44" stroke="#8a5a2b" stroke-width="5"/>
    <rect x="44" y="56" width="42" height="32" rx="4" fill="#fff7e6" stroke="#46c4a8" stroke-width="4"/>
  </g>

  <!-- #spr_arrow : round directional nav button, points right (local box 64x64).
       Engine rotates for up/down/left. -->
  <g id="spr_arrow" transform="translate(48,370)">
    <circle cx="32" cy="32" r="30" fill="#ffd264" stroke="#8a5a2b" stroke-width="5"/>
    <polygon points="24,16 48,32 24,48" fill="#5e3d1c"/>
  </g>

  <!-- #spr_home : house button → back to the hall (local box 62x56) -->
  <g id="spr_home" transform="translate(208,372)">
    <rect x="0" y="0" width="62" height="56" rx="12" fill="#ffd264" stroke="#8a5a2b" stroke-width="4"/>
    <polygon points="12,30 31,12 50,30" fill="#5e3d1c"/>
    <rect x="21" y="30" width="20" height="18" fill="#5e3d1c"/>
    <rect x="27" y="36" width="8" height="12" fill="#ffd264"/>
  </g>
</svg>
