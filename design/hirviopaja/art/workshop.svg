  </g>

  <!-- hanging lamp, centre-top, cosy warm pool (fake glow = low-opacity solid) -->
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <line x1="512" y1="46" x2="512" y2="96" stroke="#4a4150"/>
    <path d="M486 96 q26 -28 52 0 Z" fill="#ffb43d" stroke="#c77f1e"/>
    <circle cx="512" cy="104" r="8" fill="#ffd264"/>
  </g>

  <!-- stage / pedestal where the monster stands -->
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
