    <circle cx="452" cy="150" r="30" fill="#ffd264"/>
    <circle cx="462" cy="144" r="24" fill="#342a4e" opacity="0.55"/>
    <path d="M560 120 l4 11 l12 1 l-9 8 l3 12 l-10 -7 l-10 7 l3 -12 l-9 -8 l12 -1 Z" fill="#cfe8ff"/>
    <circle cx="612" cy="170" r="4" fill="#cfe8ff"/>
    <circle cx="398" cy="210" r="4" fill="#cfe8ff"/>
    <path d="M330 300 L694 300" stroke="#5e3d1c" stroke-width="10"/>
  </g>

  <!-- bunting across the top -->
  <g stroke="none">
