<!-- workshop.svg · the cosy monster lab · full scene viewBox 0 0 1024 600
     The monster assembly <g> is placed on the stage with transform="translate(312,95)"
     (its local ground y408 -> scene y503, centre x200 -> scene x512).
     ONE linearGradient (window sky) only; everything else flat. No filters/blur/mask.
     "Glow" = low-opacity solid shapes.

     CONTROL POSITIONS (drawn by the engine, NOT in this file — noted here as the plan):
       KOTI (home)      : top-left  44x44 at (16,16)
       Title            : centred y~34 ; hint line centred y~72
       LEFT  slot column (label above a ‹ › pair, arrow circles r34):
         PÄÄ   label(85,124)  ‹(48,150) ›(124,150)
         KEHO  label(85,232)  ‹(48,258) ›(124,258)
         JALAT label(85,340)  ‹(48,366) ›(124,366)
         KUVIO label(85,448)  ‹(48,474) ›(124,474)
       RIGHT slot column:
         HÄNTÄ  label(939,124) ‹(900,150) ›(976,150)
         SIIVET label(939,232) ‹(900,258) ›(976,258)
         SARVET label(939,340) ‹(900,366) ›(976,366)
         HATTU  label(939,448) ‹(900,474) ›(976,474)
       BOTTOM action buttons (~170x56, centre y558):
         YLLÄTYS x210 · HUUDA x415 · TALLENNA x620 · GALLERIA x820 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <linearGradient id="ws-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a7a"/>
      <stop offset="1" stop-color="#342a4e"/>
    </linearGradient>
  </defs>

  <!-- back wall -->
  <rect x="0" y="0" width="1024" height="600" fill="#342a4e"/>

  <!-- arched window with night sky, moon and stars (behind the monster) -->
  <g stroke-linejoin="round" stroke-linecap="round">
