    <polygon points="544,64 574,64 559,90" fill="#7cc0ff"/>
    <polygon points="654,62 684,62 669,88" fill="#ffd264"/>
    <polygon points="764,58 794,58 779,84" fill="#e8452f"/>
    <polygon points="874,52 904,52 889,78" fill="#46c4a8"/>
