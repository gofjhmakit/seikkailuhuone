    <rect x="18" y="92" width="150" height="10" rx="4" fill="#8a5a2b" stroke="#5e3d1c"/>
    <rect x="40" y="52" width="30" height="40" rx="8" fill="#46c4a8" stroke="#2e8a76"/>
    <rect x="44" y="66" width="22" height="26" rx="6" fill="#cfe8ff" opacity="0.45"/>
    <rect x="42" y="44" width="26" height="10" rx="4" fill="#8a5a2b" stroke="#5e3d1c"/>
    <rect x="108" y="48" width="32" height="44" rx="8" fill="#ff8a4c" stroke="#c75a2a"/>
    <rect x="112" y="64" width="24" height="28" rx="6" fill="#ffd264" opacity="0.45"/>
    <rect x="110" y="40" width="28" height="10" rx="4" fill="#8a5a2b" stroke="#5e3d1c"/>
    <!-- right shelf -->
    <rect x="856" y="92" width="150" height="10" rx="4" fill="#8a5a2b" stroke="#5e3d1c"/>
    <rect x="884" y="48" width="32" height="44" rx="8" fill="#7cc0ff" stroke="#3f84c4"/>
    <rect x="888" y="64" width="24" height="28" rx="6" fill="#cfe8ff" opacity="0.5"/>
    <rect x="886" y="40" width="28" height="10" rx="4" fill="#8a5a2b" stroke="#5e3d1c"/>
