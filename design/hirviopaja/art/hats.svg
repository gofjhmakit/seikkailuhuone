<?xml version="1.0" encoding="UTF-8"?>
<!-- hats.svg · 6 hats + none (dress-up) · shared space 0 0 400 440
     CROWN ANCHOR = (200,62): the hat sits on top of the head. Z-order: draw hat LAST
     (after the head) so it rests on the crown. hat-none is empty. hat-kukka has a tiny
     static bee (visual easter-egg). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440">

  <!-- 0 · hat-none -->
  <g id="hat-none"></g>

  <!-- 1 · hat-silinteri · top hat · ink -->
  <g id="hat-silinteri" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <ellipse cx="200" cy="64" rx="54" ry="12" fill="#2a2440" stroke="#16122a"/>
    <rect x="168" y="14" width="64" height="52" rx="6" fill="#2a2440" stroke="#16122a"/>
    <rect x="168" y="48" width="64" height="12" fill="#e8452f"/>
  </g>

  <!-- 2 · hat-lippis · cap · lava -->
  <g id="hat-lippis" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <path d="M152 60 q48 -52 96 0 Z" fill="#e8452f" stroke="#a82e1e"/>
    <path d="M196 60 q44 2 60 14 q-4 -10 -18 -14 Z" fill="#e8452f" stroke="#a82e1e"/>
    <circle cx="200" cy="18" r="6" fill="#ffd264"/>
  </g>

  <!-- 3 · hat-kruunu · crown · gold -->
  <g id="hat-kruunu" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <path d="M156 62 l0 -34 l20 16 l24 -28 l24 28 l20 -16 l0 34 Z" fill="#ffd264" stroke="#c9922f"/>
    <circle cx="200" cy="40" r="5" fill="#e8452f"/>
    <circle cx="170" cy="48" r="4" fill="#46c4a8"/>
    <circle cx="230" cy="48" r="4" fill="#46c4a8"/>
  </g>

  <!-- 4 · hat-juhla · party cone · teal -->
  <g id="hat-juhla" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <path d="M200 6 l34 56 l-68 0 Z" fill="#46c4a8" stroke="#2e8a76"/>
    <circle cx="200" cy="6" r="8" fill="#ffd264" stroke="#c9922f"/>
    <circle cx="188" cy="40" r="4" fill="#fff7e6"/>
    <circle cx="210" cy="30" r="4" fill="#fff7e6"/>
  </g>

  <!-- 5 · hat-kypara · helmet · sky -->
  <g id="hat-kypara" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <path d="M150 64 q0 -58 50 -58 q50 0 50 58 Z" fill="#7cc0ff" stroke="#3f84c4"/>
    <rect x="148" y="58" width="104" height="12" rx="6" fill="#3f84c4" stroke="#3f84c4"/>
    <rect x="194" y="10" width="12" height="40" rx="5" fill="#fff7e6"/>
  </g>

  <!-- 6 · hat-kukka · flower + tiny bee · gold -->
  <g id="hat-kukka" stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <path d="M200 60 l0 -22" fill="none" stroke="#2b7d39" stroke-width="5"/>
    <circle cx="178" cy="34" r="12" fill="#ffd264" stroke="#c9922f"/>
    <circle cx="222" cy="34" r="12" fill="#ffd264" stroke="#c9922f"/>
    <circle cx="200" cy="18" r="12" fill="#ffd264" stroke="#c9922f"/>
    <circle cx="200" cy="34" r="9" fill="#ffb43d" stroke="#c77f1e"/>
    <g id="hat-kukka-bee">
      <ellipse cx="238" cy="14" rx="9" ry="6" fill="#ffd264" stroke="#2a2440" stroke-width="2"/>
      <path d="M236 10 l0 8 M240 10 l0 8" stroke="#2a2440" stroke-width="2"/>
      <ellipse cx="236" cy="9" rx="5" ry="3" fill="#cfe8ff" stroke="#8fb8db" stroke-width="1"/>
    </g>
  </g>

</svg>
