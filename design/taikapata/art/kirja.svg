    <rect x="456" y="355" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
    <rect x="584" y="355" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
    <rect x="712" y="355" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
