    <rect x="584" y="145" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
    <rect x="712" y="145" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
    <rect x="840" y="145" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
    <rect x="72" y="355" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
    <rect x="200" y="355" width="112" height="150" rx="12" fill="#fff7e6" stroke="#d9c89a"/>
