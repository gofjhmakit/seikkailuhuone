<?xml version="1.0" encoding="UTF-8"?>
<!-- scene.svg · cosy alchemist lab + cauldron on a fire · full scene viewBox 0 0 1024 600
     ONE linearGradient (#lab back wall); glow/fire/embers are low-opacity SOLIDS. NO clipPath
     (the liquid is a pre-shaped path that already fits the pot interior). No filters/blur/mask.

     ENGINE HOOKS:
       #liquid   recolour fill = averaged ingredient colour (default resting teal)
       #surface  recolour fill = lighter shade of liquid; gentle bob on stir
       #fire     gentle bounded flicker (sway/scale), NO strobe
       #cauldron-glow  warm pool (static low-opacity)
       result sprite + bubbles = drawn by engine above the pot (~y200), canvas burst <=24
     SHELF: ingredient bottles (ingredients.svg) placed by engine, bottoms on the plank (y150),
       9 centres x:92,197,302,407,512,617,722,827,932 ; names drawn under each at y~172.
     CONTROLS (engine): KOTI 44x44 (16,16) · title y~28 · hint y~62 ·
       SEKOITA round ~128 (820,470) · TYHJENNÄ ~150x70 (70,470) · RESEPTIKIRJA ~160x52 (430,556) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 600" width="1024" height="600">
  <defs>
    <linearGradient id="lab" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#342a4e"/>
      <stop offset="1" stop-color="#241a33"/>
    </linearGradient>
  </defs>

  <!-- wall -->
  <rect x="0" y="0" width="1024" height="600" fill="url(#lab)"/>

  <!-- a couple of wall stars + small moon (cosy) -->
  <g>
    <circle cx="880" cy="70" r="22" fill="#ffd264"/>
    <circle cx="889" cy="64" r="18" fill="#342a4e" opacity="0.6"/>
    <path d="M120 70 l3 8 l9 1 l-7 6 l2 9 l-7 -5 l-7 5 l2 -9 l-7 -6 l9 -1 Z" fill="#cfe8ff"/>
    <circle cx="300" cy="56" r="3" fill="#cfe8ff"/>
    <circle cx="700" cy="60" r="3" fill="#cfe8ff"/>
  </g>

  <!-- ingredient shelf (bottles placed by engine) -->
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <rect x="30" y="150" width="964" height="16" rx="6" fill="#8a5a2b" stroke="#5e3d1c"/>
    <path d="M70 166 L82 190 M954 166 L942 190" stroke="#5e3d1c" stroke-width="5"/>
  </g>

  <!-- warm pool behind the cauldron -->
  <ellipse id="cauldron-glow" cx="512" cy="370" rx="160" ry="150" fill="#ff8a4c" opacity="0.10"/>

  <!-- CAULDRON -->
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="5">
    <!-- bowl body -->
    <path d="M384 250 Q376 452 512 470 Q648 452 640 250 Z" fill="#4a4150" stroke="#2a2440"/>
    <!-- handles -->
    <path d="M384 268 q-26 6 -22 34" fill="none" stroke="#2a2440" stroke-width="8"/>
    <path d="M640 268 q26 6 22 34" fill="none" stroke="#2a2440" stroke-width="8"/>
    <!-- liquid (pre-shaped path, recoloured by engine) -->
    <path id="liquid" d="M396 284 Q396 440 512 456 Q628 440 628 284 Z" fill="#2e8a76" stroke="none"/>
    <ellipse id="surface" cx="512" cy="284" rx="116" ry="18" fill="#46c4a8" stroke="none"/>
    <!-- rim / lip -->
    <ellipse cx="512" cy="248" rx="138" ry="28" fill="#7a6f86" stroke="#4a4150"/>
    <ellipse cx="512" cy="248" rx="116" ry="20" fill="#4a4150" stroke="none"/>
    <!-- feet -->
    <path d="M452 466 q-14 20 2 34 q16 2 20 -14 Z" fill="#4a4150" stroke="#2a2440"/>
    <path d="M572 466 q14 20 -2 34 q-16 2 -20 -14 Z" fill="#4a4150" stroke="#2a2440"/>
  </g>

  <!-- fire under the cauldron (gentle flicker) -->
  <g stroke-linejoin="round" stroke-linecap="round" stroke-width="4">
    <ellipse cx="512" cy="508" rx="110" ry="24" fill="#ff8a4c" opacity="0.14" stroke="none"/>
    <rect x="430" y="506" width="60" height="12" rx="5" fill="#5e3d1c" stroke="#3b2611"/>
    <rect x="534" y="506" width="60" height="12" rx="5" fill="#5e3d1c" stroke="#3b2611"/>
    <g id="fire">
      <path d="M462 508 q-16 -30 4 -50 q-4 20 10 26 q8 -10 2 -24 q22 16 14 40 q-2 10 -14 12 Z" fill="#ff8a4c" stroke="#c75a2a"/>
      <path d="M520 510 q-18 -36 6 -58 q-4 24 12 30 q8 -12 2 -28 q24 20 14 46 q-4 12 -18 14 Z" fill="#ffb43d" stroke="#c77f1e"/>
      <path d="M560 508 q-14 -26 4 -44 q-4 18 8 22 q6 -8 2 -20 q18 14 12 34 q-2 8 -12 10 Z" fill="#ffd264" stroke="#c9922f"/>
    </g>
  </g>
</svg>
