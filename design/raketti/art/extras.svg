<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 150" width="300" height="150" stroke-linejoin="round" stroke-linecap="round">
  <!-- ATLAS: chicken gag + destination sticker. Each <g id> has a local origin at its
       translate; engine recenters. Background is preview-only. -->
  <rect x="0" y="0" width="300" height="150" fill="#241a33"/>
  <line x1="170" y1="0" x2="170" y2="150" stroke="#342a4e" stroke-width="2"/>

  <!-- #chicken : runaway chicken gag (local ~114x108) -->
  <g id="chicken" transform="translate(24,20)">
    <path d="M18 60 q-22 -10 -28 -32 q26 4 34 22 Z" fill="#fff7e6" stroke="#b07a3c" stroke-width="3"/>
    <ellipse cx="46" cy="60" rx="38" ry="30" fill="#fff7e6" stroke="#b07a3c" stroke-width="4"/>
    <path d="M44 50 q22 -6 30 10 q-14 12 -30 4 Z" fill="#f3e7cc" stroke="#b07a3c" stroke-width="3"/>
    <circle cx="78" cy="36" r="20" fill="#fff7e6" stroke="#b07a3c" stroke-width="4"/>
    <path d="M68 18 q4 -12 10 -2 q6 -12 10 0 q6 -10 8 2 Z" fill="#e8452f" stroke="#8a5a2b" stroke-width="2"/>
    <path d="M96 36 l16 -4 l-14 12 Z" fill="#ffb43d" stroke="#8a5a2b" stroke-width="2"/>
    <path d="M92 48 q5 10 -4 13 q-6 -2 -4 -13 Z" fill="#e8452f"/>
    <circle cx="82" cy="32" r="3.5" fill="#2a2440"/>
    <line x1="40" y1="88" x2="36" y2="106" stroke="#ffb43d" stroke-width="4"/>
    <line x1="56" y1="88" x2="60" y2="106" stroke="#ffb43d" stroke-width="4"/>
    <path d="M36 106 l-8 4 M36 106 l8 4 M60 106 l-8 4 M60 106 l8 4" fill="none" stroke="#ffb43d" stroke-width="3"/>
  </g>

  <!-- #sticker : star reward sticker (local ~80x80) -->
  <g id="sticker" transform="translate(200,32)">
    <path d="M40 4 l11 24 l26 3 l-19 18 l5 26 l-23 -13 l-23 13 l5 -26 l-19 -18 l26 -3 Z" fill="#ffd264" stroke="#ffffff" stroke-width="7"/>
    <path d="M40 18 l6 14 l15 2 l-11 10 l3 15 l-13 -8 l-13 8 l3 -15 l-11 -10 l15 -2 Z" fill="#ffb43d"/>
  </g>
</svg>
