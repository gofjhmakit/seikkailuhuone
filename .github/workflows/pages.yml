name: Deploy to GitHub Pages

# Publishes the playable app to GitHub Pages. No build tooling is needed — the game
# pages are already committed (built from design art by tools/build_*.py). The build
# job just copies the runtime files into a lean _site/ and uploads it, so the source
# (design/, poc/, tools/, tests/, *.template.html) is NOT served.
#
# Build and deploy are split into two jobs on purpose: when deploy-pages runs in the
# same job as upload-pages-artifact it sometimes queries the artifact API before the
# upload is indexed and fails with "No artifacts named github-pages were found". The
# job boundary (needs: build) gives the backend time to catch up — this is the layout
# GitHub's own starter workflow uses. See actions/deploy-pages#451.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the playable app into _site
        run: |
          mkdir -p _site/games
          cp index.html seikkailu.css manifest.webmanifest _site/
          cp -r engine content assets icons _site/
          cp games/*.html _site/games/
          # drop the source template + stub pages (keep only built game pages)
          rm -f _site/games/*.template.html _site/games/_stub.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
